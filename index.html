<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meine Bibliothek</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
    />

    <style>
      /* --- BASIS: Farben, Layout, Schrift --- */
      body {
        background-color: #121212; /* fast schwarz */
        color: #e0e0e0; /* hellgrau */
        font-family: "Roboto", sans-serif;
        margin: 2rem;
        font-size: 0.9rem;
        /* Modus umschalten (Animation) */
        transition: background-color 1s ease, color 1.8s ease;
      }

      h1,
      h3 {
        text-align: center;
        color: #ffffff;
      }

      #library {
        transition: all 0.4s ease;
      }

      /* 1. Buttonreihe */
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1rem;
        justify-content: center;
      }

      button,
      select,
      input[type="text"],
      textarea {
        background-color: #1e1e1e;
        color: #e0e0e0;
        border: 1px solid #333;
        border-radius: 5px;
        padding: 0.5rem 1rem;
      }

      button {
        cursor: pointer;
      }

      button:disabled,
      select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Standardansicht (Detailansicht) */
      #library {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 0.3rem;
      }

      .book {
        background: #1e1e1e;
        padding: 1rem;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        transition: padding 0.3s ease, width 0.3s ease, gap 1.8s ease,
          opacity 0.3s ease, transform 0.3s ease;
      }

      .book.fade-out {
        opacity: 0;
        transform: scale(0.95);
      }

      .book img {
        width: 110px;
        height: 160px;
        object-fit: contain;
        border-radius: 5px;
        box-shadow: 8px 0 8px rgba(0, 0, 0, 1);
        cursor: pointer;
        transition: width 1.3s ease, height 1.3s ease;
      }

      .book-info {
        width: 100%;
        text-align: center;
      }

      .book-actions {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.4rem;
      }

      .stars-display {
        color: #fbc02d;
        font-size: 1.2rem;
        margin-top: 0.3rem;
        text-align: center;
      }

      .tag {
        display: inline-block;
        background-color: #333;
        color: #e0e0e0;
        padding: 0.2rem 0.5rem;
        border-radius: 10px;
        font-size: 0.8rem;
        margin: 0.1rem;
      }

      .book-info .highlight-block {
        background-color: rgba(255, 255, 255, 0.05);
        padding: 0.3rem 0.5rem 0.1rem;
        border-radius: 5px;
        margin-bottom: 0.3rem;
      }

      .book-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
      }

      .book-subtitle {
        font-size: 0.75rem;
        font-weight: normal;
        color: #aaa;
        margin-top: 0.2rem;
      }

      .book-info .author {
        font-style: italic;
        font-weight: 500;
        margin-top: 0.2rem;
        margin-bottom: 0.2rem;
        color: #bbb;
      }

      /* Kompaktansicht */
      body.compact-view #library {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.8rem;
      }

      body.compact-view .book {
        padding: 0.3rem;
        margin: 0;
        width: 100%;
      }

      body.compact-view .book img {
        width: 80px;
        height: 110px;
      }

      /* Nur Titel + Autor in der Kompaktansicht */
      body.compact-view .book-info > :not(.highlight-block) {
        display: none;
      }

      body.compact-view .highlight-block .book-title {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 0.2rem;
      }

      body.compact-view .highlight-block .author {
        font-size: 0.85rem;
        font-style: italic;
        color: #888;
        margin-bottom: 0.3rem;
      }

      /* --- FILTER, SORTIERUNG & SUCHFELD --- */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.3rem;
        margin-bottom: 1rem;
      }

      #filters {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1rem;
        justify-content: center;
        align-items: center;
      }

      .filter-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      #search-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #search-input {
        width: 150px;
        padding: 0.5rem;
      }

      #search-input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 8px #007bff;
        background-color: #1a1a1a;
      }

      #clear-search {
        margin-left: -20px;
        cursor: pointer;
        color: #888;
      }

      #category-list li.active {
        background-color: #403e3d;
        color: white;
        border-radius: 4px;
      }

      /* --- DIALOG / FORMULAR --- */
      dialog {
        background: #1e1e1e;
        color: #e0e0e0;
        border: none;
        border-radius: 8px;
        padding: 1rem;
      }

      #edit-dialog form {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        min-width: 500px;
        margin: auto;
      }

      #edit-dialog label {
        display: flex;
        flex-direction: column;
        font-size: 0.9rem;
        padding: 0.3rem 0.5rem;
        box-sizing: border-box;
      }

      #edit-dialog input[type="text"],
      #edit-dialog textarea,
      #edit-dialog select {
        width: 100%;
        padding: 0.4rem;
        box-sizing: border-box;
      }

      .checkbox-inline {
        display: flex;
        align-items: center;
        gap: 0.1rem;
      }

      .rating-wrapper {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .stars {
        display: flex;
        gap: 0.3rem;
        cursor: pointer;
        font-size: 1.3rem;
      }

      .stars span {
        color: #888;
        transition: color 0.2s;
      }

      .stars span.active {
        color: gold;
      }

      /* --- MODALE FENSTER --- */
      .modal.hidden {
        display: none;
      }

      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
      }

      .modal-content {
        background-color: #1e1e1e;
        color: #e0e0e0;
        padding: 1.5rem;
        border-radius: 8px;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-content label {
        display: block;
        margin-bottom: 0.5rem;
      }

      .modal-content input[type="checkbox"] {
        margin-right: 0.5rem;
      }

      .modal-content button {
        margin-top: 1rem;
      }

      .modal-content ul {
        list-style: none;
        padding: 0;
      }

      .modal-content ul li {
        padding: 0.3rem;
        cursor: pointer;
      }

      /* --- Umschalter oben --- */
      #top-buttons {
        position: fixed;
        top: 1rem;
        right: 1rem;
        display: flex;
        gap: 0.5rem;
        z-index: 10000;
      }

      #top-buttons button {
        font-size: 0.8rem;
        border: none;
        border-radius: 20px;
        padding: 0.3rem 1rem;
        background-color: #333;
        color: #fff;
      }

      /* --- Benachrichtigung --- */
      #toast {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        background-color: #333;
        color: white;
        padding: 0.8rem 1.2rem;
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        z-index: 10001;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }

      #toast.show {
        opacity: 1;
        pointer-events: auto;
      }

      /* --- Umschalter Genre (Und/Oder) --- */
      :root {
        --text-color: #e0e0e0;
        --accent-color: #4caf50;
      }

      .toggle-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      .toggle-label {
        font-size: 0.9em;
        color: var(--text-color);
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 46px;
        height: 24px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #ccc;
        border-radius: 24px;
        transition: 0.4s;
      }

      .slider:before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: 0.4s;
      }

      .toggle-switch input:checked + .slider {
        background-color: var(--accent-color);
      }

      .toggle-switch input:checked + .slider:before {
        transform: translateX(22px);
      }

      /* Einheitlicher Stil für aktive Buttons */
      button.active {
        background-color: #403e3d;
        color: white;
        font-weight: normal;
      }

      /* --- Hover --- */
      @media (hover: hover) and (pointer: fine) {
        button:not(:disabled):hover,
        select:not(:disabled):hover,
        input[type="text"]:hover,
        textarea:hover {
          background-color: #333;
        }
      }

      /* --- Heller Modus --- */
      body.light-mode {
        background-color: #f8f1e4;
        color: #2e2e2e;
        --text-color: #2e2e2e;
      }

      body.light-mode h3 {
        color: #3b2f1c;
      }

      body.light-mode .book {
        background-color: #f5e6c1;
        color: #2e2e2e;
        box-shadow: 10px 10px 10px rgba(160, 120, 60, 0.2);
        border: 1px solid #caa66a;
      }

      body.light-mode .book-info {
        color: #2e2e2e;
      }

      body.light-mode .book-subtitle {
        color: #555;
      }

      body.light-mode .book-info .highlight-block {
        background-color: rgba(185, 131, 0, 0.2);
      }

      body.light-mode .book-info .author {
        color: #444;
      }

      body.light-mode .modal-content,
      body.light-mode dialog,
      body.light-mode input,
      body.light-mode textarea,
      body.light-mode select,
      body.light-mode button {
        background-color: #f5e6c5;
        color: #2e2e2e;
        border: 1px solid #caa66a;
      }

      body.light-mode input[type="text"],
      body.light-mode textarea,
      body.light-mode #edit-dialog select {
        background-color: #fffaf0;
        color: #2e2e2e;
      }

      body.light-mode #search-input {
        background-color: #f5e6c1;
      }

      body.light-mode #search-input:focus {
        border-color: #c28f49;
        box-shadow: 0 0 8px #c28f49;
        background-color: #fff3dd;
      }

      body.light-mode button.active,
      body.light-mode #category-list li.active {
        background-color: #c28f49;
        color: white;
      }

      body.light-mode .stars-display {
        color: #c28f00;
      }

      body.light-mode .stars span.active {
        color: #f5a527;
      }

      body.light-mode #top-buttons button {
        background-color: #f5e6c1;
        color: #2e2e2e;
      }

      @media (hover: hover) and (pointer: fine) {
        body.light-mode button:not(:disabled):hover {
          background-color: #c28f49;
          color: #2e2e2e;
        }
      }
    </style>
  </head>

  <body>
    <h3>📚 Meine Bibliothek</h3>
    <div
      id="read-counter"
      style="text-align: center; margin-bottom: 1rem; font-size: 0.9rem"
    ></div>

    <div id="top-buttons">
      <button id="viewToggleBtn" type="button" title="Ansicht umschalten">🔽</button>
      <button id="mode-toggle" type="button" title="Hell/Dunkel">🌙</button>
    </div>

    <div id="controls">
      <button id="btn-add-isbn" type="button">🔎 Per ISBN hinzufügen</button>
      <button id="btn-import" type="button">📥 Epub importieren</button>
      <button id="btn-new" type="button">➕ Neuer Eintrag</button>
      <button id="btn-save" type="button">💾 Bibliothek speichern</button>
      <button id="btn-load" type="button">📂 Bibliothek laden</button>
      <input type="file" id="file-input" accept=".epub" multiple hidden />
      <input type="file" id="load-file" accept=".json" hidden />
    </div>

    <!-- Filter Gelesen | Neu | Zuletzt hinzugefügt, Kategorie, Genre, Sortierung, Suche -->
    <div id="filters" class="filter-toolbar">
      <div class="filter-group">
        <button id="read-btn" type="button">📗 Gelesen</button>
        <button id="unread-btn" type="button">🆕 Neu</button>
        <button id="latest-added-button" type="button">⏳ Zuletzt hinzugefügt</button>
      </div>

      <div class="filter-group">
        <button id="category-button" type="button">Kategorie filtern</button>
        <button id="genre-button" type="button">Genre filtern</button>
      </div>

      <div class="filter-group">
        <label for="sort-field">Sortieren:</label>
        <select id="sort-field">
          <option value="author">Autor / Serie</option>
          <option value="title">Titel</option>
          <option value="published">Erscheinungsdatum</option>
          <option value="rating">Bewertung</option>
          <option value="added">Hinzugefügt</option>
        </select>
        <button id="sort-dir" type="button"></button>
      </div>

      <div id="search-wrapper">
        <input type="text" id="search-input" placeholder="Suche..." />
        <span id="clear-search" style="display: none">&times;</span>
      </div>
    </div>

    <!-- Filterleiste A-Z -->
    <div class="filter-bar" id="filter-bar"></div>

    <!-- Modal zur Kategorieauswahl -->
    <div id="category-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Kategorie auswählen</h3>
        <ul id="category-list"></ul>
        <button id="category-cancel" type="button">Abbrechen</button>
      </div>
    </div>

    <!-- Modal zur Genre-Auswahl -->
    <div id="genre-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="genre-modal-title">Genres auswählen</h3>
        <form id="genre-form"></form>
        <div class="toggle-container">
          <label class="toggle-switch">
            <input type="checkbox" id="genreMatchToggle" />
            <span class="slider"></span>
          </label>
          <span class="toggle-label"
            >Alle gewählten Genres müssen enthalten sein</span
          >
        </div>
        <button id="genre-apply" type="button">OK</button>
        <button id="genre-cancel" type="button">Abbrechen</button>
      </div>
    </div>

    <!-- Bücher -->
    <div id="library"></div>

    <!-- Paginierung -->
    <div
      id="pagination-controls"
      style="
        display: flex;
        align-items: center;
        gap: 1rem;
        justify-content: center;
        margin-top: 1rem;
      "
    >
      <label for="booksPerPage">Bücher pro Seite:</label>
      <select id="booksPerPage">
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="150">150</option>
        <option value="200">200</option>
        <option value="250">250</option>
      </select>
      <div id="pagination-buttons"></div>
    </div>

    <!-- Formular für Buch hinzufügen/bearbeiten -->
    <dialog id="edit-dialog">
      <form method="dialog" id="edit-form">
        <h3>Buch bearbeiten oder hinzufügen</h3>
        <input type="hidden" id="edit-index" />

        <label
          >Titel:
          <input type="text" id="edit-title" required />
        </label>

        <label
          >Untertitel:
          <input type="text" id="edit-subtitle" />
        </label>

        <label
          >Autor(en) (Nachname, Vorname – Semikolon-getrennt):
          <input type="text" id="edit-authors" required />
        </label>

        <div style="display: flex; gap: 1rem">
          <label style="flex: 1"
            >Serie:
            <input type="text" id="edit-series" />
          </label>
          <label style="width: 12ch"
            >Band:
            <input type="text" id="edit-volume" style="width: 100%" />
          </label>
        </div>

        <div style="display: flex; gap: 1rem">
          <label style="flex: 1"
            >Veröffentlicht:
            <input type="text" id="edit-publishedDate" />
          </label>
          <label style="flex: 1"
            >ISBN:
            <input type="text" id="edit-isbn" />
          </label>
        </div>

        <div style="display: flex; gap: 1rem">
          <label style="flex: 1"
            >Kategorie:
            <input type="text" id="edit-category" list="categorySuggestions" />
          </label>
          <label style="flex: 1"
            >Genre (mehrere mit Semikolon):
            <input type="text" id="edit-genre" list="genreSuggestions" />
          </label>
        </div>

        <label
          >Beschreibung:
          <textarea id="edit-description" rows="8"></textarea>
        </label>

        <div style="display: flex; gap: 1rem">
          <label style="width: 12ch"
            >Seitenzahl:
            <input type="text" id="edit-pageCount" style="width: 100%" />
          </label>
          <label style="flex: 1"
            >Cover-URL:
            <input type="text" id="edit-thumbnail" />
          </label>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
          "
        >
          <div class="checkbox-inline">
            <input type="checkbox" id="edit-read" />
            <label for="edit-read">📗 Gelesen</label>
          </div>
          <div class="rating-wrapper">
            <span>Bewertung:</span>
            <div
              id="edit-rating"
              class="stars"
              data-value="0"
              title="Erneuter Klick auf denselben Stern entfernt die Bewertung"
            >
              <span data-star="1">☆</span>
              <span data-star="2">☆</span>
              <span data-star="3">☆</span>
              <span data-star="4">☆</span>
              <span data-star="5">☆</span>
            </div>
          </div>
        </div>

        <label
          >Schlagwörter (kommagetrennt):
          <input
            type="text"
            id="edit-tags"
            placeholder="… werden in ›Suche‹ gefunden"
          />
        </label>

        <menu
          style="
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1rem;
          "
        >
          <button type="submit">📅 Speichern</button>
          <button type="button" id="edit-cancel">Abbrechen</button>
        </menu>
      </form>
    </dialog>

    <!-- Modal für Detailanzeige -->
    <div id="detail-modal" class="modal hidden">
      <div class="modal-content" id="detail-modal-content"></div>
    </div>

    <!-- Datalist Vorschläge -->
    <datalist id="categorySuggestions"></datalist>
    <datalist id="genreSuggestions"></datalist>

    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
      // =====================================================================
      // Konfiguration
      // =====================================================================

      // URL der Bibliotheksdatei im GitHub-Repository
      const REPO_JSON_URL =
        "https://raw.githubusercontent.com/Takasila/mylibrary/main/bibliothek.json";

      // API-Schlüssel für Google Books – steht NICHT in dieser Datei.
      // Er wird erst bei Bedarf (ISBN-Suche, EPUB-Import) abgefragt und nur im
      // eigenen Browser gespeichert. Ohne Schlüssel funktioniert die Abfrage
      // ebenfalls, nur mit geringerem Kontingent.
      const API_KEY_STORAGE = "googleBooksApiKey";
      let apiKeyAsked = false; // höchstens einmal pro Seitenaufruf fragen

      function getApiKey() {
        let key = "";
        try {
          key = localStorage.getItem(API_KEY_STORAGE) || "";
        } catch {}
        if (!key && !apiKeyAsked) {
          apiKeyAsked = true;
          const input = prompt(
            "Google-Books-API-Key eingeben (optional – Abbrechen = ohne Key fortfahren):"
          );
          if (input && input.trim()) {
            key = input.trim();
            try {
              localStorage.setItem(API_KEY_STORAGE, key);
            } catch {}
          }
        }
        return key;
      }

      // Kategorie + Genre hier eintragen
      const genreMap = {
        Belletristik: [
          "Erotik",
          "Fantasy",
          "Frauen, Liebesroman",
          "Historisch",
          "Horror",
          "Humor",
          "Kinder, Jugend",
          "Klassiker",
          "Krimi & Thriller",
          "Mystery",
          "Romane & Erzählungen",
          "Science Fiction",
        ],
        Ratgeber: [
          "Beruf",
          "Freizeit",
          "Gesundheit & Medizin",
          "Lebensführung",
          "Sport",
          "Wirtschaft",
        ],
        Sachbuch: [
          "Biografien & Erinnerungen",
          "Geschichte",
          "Gesundheit & Medizin",
          "Kunst",
          "Mathematik",
          "Naturwissenschaft",
          "Philosophie",
          "Politik",
          "Psychologie",
          "Reisen",
          "Religion",
          "Schule",
          "Tiere",
        ],
      };

      const ALL_GENRES = [...new Set(Object.values(genreMap).flat())].sort(
        (a, b) => a.localeCompare(b, "de")
      );

      const STORAGE_KEY = "epubLibrary";

      // Platzhalter, wenn kein Cover vorhanden ist oder das Bild nicht lädt
      const NO_COVER =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(
          "<svg xmlns='http://www.w3.org/2000/svg' width='110' height='160' viewBox='0 0 110 160'>" +
            "<rect width='110' height='160' rx='6' fill='#2a2a2a'/>" +
            "<text x='55' y='84' font-family='sans-serif' font-size='12' fill='#888' text-anchor='middle'>Kein Cover</text>" +
            "</svg>"
        );

      // Standard-Sortierrichtung je Sortierfeld
      const DEFAULT_SORT_DIR = {
        author: "asc",
        title: "asc",
        published: "desc",
        rating: "desc",
        added: "desc",
      };

      // =====================================================================
      // Zustand
      // =====================================================================
      let library = loadLibraryFromStorage();
      let currentPage = 1;
      let booksPerPage =
        parseInt(localStorage.getItem("booksPerPage"), 10) || 50;
      let showLatestAdded = false;
      let selectedCategories = [];
      let selectedGenres = [];
      let genreMatchMode = "any"; // 'any' = Oder, 'all' = Und
      let activeFilters = []; // Buchstabenfilter A–Z
      let filterStatus = "all"; // 'all', 'read', 'unread'
      let sortField = localStorage.getItem("library-sort-field") || "author";
      let sortDir =
        localStorage.getItem("library-sort-dir") ||
        DEFAULT_SORT_DIR[sortField] ||
        "asc";
      let compactViewEnabled = false;

      if (!DEFAULT_SORT_DIR[sortField]) sortField = "author";

      // =====================================================================
      // Hilfsfunktionen
      // =====================================================================
      const $ = (id) => document.getElementById(id);

      // Text sicher in HTML einsetzen
      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      }

      // Beschreibung: einfache Formatierung (Absätze, fett, kursiv, Listen)
      // erlauben, alles andere entfernen
      const ALLOWED_TAGS = new Set([
        "P", "BR", "B", "I", "EM", "STRONG", "UL", "OL", "LI",
      ]);

      function sanitizeHtml(html) {
        const text = String(html ?? "");
        if (!/<[a-z]/i.test(text)) {
          return escapeHtml(text).replace(/\n/g, "<br>");
        }
        const doc = new DOMParser().parseFromString(
          `<div>${text}</div>`,
          "text/html"
        );
        const clean = (node) => {
          [...node.childNodes].forEach((child) => {
            if (child.nodeType === Node.ELEMENT_NODE) {
              if (["SCRIPT", "STYLE", "IFRAME", "OBJECT"].includes(child.tagName)) {
                child.remove();
                return;
              }
              clean(child);
              if (ALLOWED_TAGS.has(child.tagName)) {
                [...child.attributes].forEach((a) =>
                  child.removeAttribute(a.name)
                );
              } else {
                child.replaceWith(...child.childNodes);
              }
            } else if (child.nodeType !== Node.TEXT_NODE) {
              child.remove();
            }
          });
        };
        const root = doc.body.firstElementChild;
        clean(root);
        return root.innerHTML;
      }

      function normalizeName(name) {
        return String(name ?? "")
          .trim()
          .replace(/,+/g, ",")
          .replace(/\s*,\s*/g, ", ")
          .replace(/\s*;\s*/g, "; ")
          .replace(/^;+|;+$|^,+|,+$/g, "")
          .split(";")
          .map((part) => part.trim())
          .filter(Boolean)
          .join("; ");
      }

      function normalizeFirstLetter(name) {
        return normalizeName(name)
          .charAt(0)
          .toUpperCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      }

      // Autoren ins Format "Nachname, Vorname" bringen
      function formatAuthors(authors) {
        return (authors || [])
          .map((name) => {
            name = String(name).trim();
            if (name.includes(",")) return normalizeName(name);
            const parts = name.split(/\s+/);
            if (parts.length >= 2) {
              const lastName = parts.pop();
              return `${lastName}, ${parts.join(" ")}`;
            }
            return name;
          })
          .filter(Boolean);
      }

      // "2.0" -> "2", "1.5" bleibt
      function formatVolume(v) {
        const s = String(v ?? "").trim();
        return /^\d+\.0+$/.test(s) ? String(parseInt(s, 10)) : s;
      }

      // --- ISBN ---
      function cleanIsbn(value) {
        return String(value ?? "")
          .replace(/[^0-9Xx]/g, "")
          .toUpperCase();
      }

      function convertISBN10to13(isbn10) {
        const core = "978" + isbn10.substring(0, 9);
        let sum = 0;
        for (let i = 0; i < core.length; i++) {
          sum += parseInt(core[i], 10) * (i % 2 === 0 ? 1 : 3);
        }
        return core + ((10 - (sum % 10)) % 10);
      }

      // Liefert immer ISBN-13 (sofern möglich)
      function toIsbn13(value) {
        const c = cleanIsbn(value);
        return /^\d{9}[\dX]$/.test(c) ? convertISBN10to13(c) : c;
      }

      // Prüfziffer kontrollieren
      function isValidIsbn(c) {
        if (/^\d{9}[\dX]$/.test(c)) {
          let s = 0;
          for (let i = 0; i < 10; i++) {
            s += (c[i] === "X" ? 10 : +c[i]) * (10 - i);
          }
          return s % 11 === 0;
        }
        if (/^97[89]\d{10}$/.test(c)) {
          let s = 0;
          for (let i = 0; i < 13; i++) s += +c[i] * (i % 2 ? 3 : 1);
          return s % 10 === 0;
        }
        return false;
      }

      // Dublettenprüfung – vergleicht immer ISBN-13 mit ISBN-13
      function isbnExists(isbn13) {
        if (!isbn13) return false;
        return library.some((b) => b.isbn && toIsbn13(b.isbn) === isbn13);
      }

      // --- Daten laden / speichern ---
      function normalizeBook(b) {
        const authors = Array.isArray(b.authors)
          ? b.authors
          : b.authors
          ? String(b.authors).split(";").map((s) => s.trim()).filter(Boolean)
          : [];
        const tags = Array.isArray(b.tags)
          ? b.tags
          : b.tags
          ? String(b.tags).split(",").map((s) => s.trim()).filter(Boolean)
          : [];
        return { ...b, authors, tags };
      }

      function loadLibraryFromStorage() {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(data)
            ? data.filter((b) => b && typeof b === "object").map(normalizeBook)
            : [];
        } catch (err) {
          console.error("Bibliothek konnte nicht gelesen werden:", err);
          return [];
        }
      }

      function persistLibrary() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(library));
          return true;
        } catch (err) {
          console.error("Speichern fehlgeschlagen:", err);
          showToast(
            "Speichern im Browser fehlgeschlagen (Speicher voll?). Bitte Bibliothek als JSON sichern.",
            6000
          );
          return false;
        }
      }

      // --- Meldung ---
      let toastTimer = null;
      function showToast(message, duration = 3000) {
        let toast = $("toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "toast";
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), duration);
      }

      // --- Google Books ---
      async function fetchGoogleInfo(isbn) {
        const key = getApiKey();
        const base = `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`;
        let response = await fetch(
          base + (key ? `&key=${encodeURIComponent(key)}` : "")
        );
        let usedKey = !!key;
        // 500/503 mit Key: Störung betrifft oft nur das Projekt des Keys -> ohne Key wiederholen
        if (key && (response.status === 500 || response.status === 503)) {
          console.warn(`Google Books mit Key: HTTP ${response.status} – neuer Versuch ohne Key`);
          response = await fetch(base);
          usedKey = false;
        }
        // Ungültiger Key -> entfernen, damit beim nächsten Mal neu gefragt wird
        if (response.status === 400 && key) {
          try {
            localStorage.removeItem(API_KEY_STORAGE);
          } catch {}
          showToast(
            "Der gespeicherte API-Key wurde abgelehnt und entfernt. Bitte Seite neu laden.",
            6000
          );
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let data = await response.json();
        // 0 Treffer mit Key: Gegenprobe ohne Key
        if (usedKey && !data.items?.length) {
          console.warn("Google Books mit Key: 0 Treffer – Gegenprobe ohne Key");
          const response2 = await fetch(base);
          if (response2.ok) data = await response2.json();
        }
        return data.items?.[0]?.volumeInfo || null;
      }

      function applyGoogleInfo(book, info) {
        book.title = info.title || book.title;
        book.subtitle = info.subtitle?.trim() || book.subtitle || "";
        if (info.authors?.length) book.authors = formatAuthors(info.authors);
        book.publishedDate = info.publishedDate || book.publishedDate || "";
        book.description = info.description || book.description || "";
        const thumb =
          info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail;
        if (thumb) book.thumbnail = thumb.replace(/^http:/, "https:");
        book.pageCount = info.pageCount
          ? String(info.pageCount)
          : book.pageCount || "Unbekannt";
      }

      // =====================================================================
      // Filter, Sortierung, Darstellung
      // =====================================================================
      function renderFilterBar() {
        const filterBar = $("filter-bar");
        filterBar.innerHTML = "";

        const toggleLetters = (letters) => {
          const allActive = letters.every((l) => activeFilters.includes(l));
          if (allActive) {
            activeFilters = activeFilters.filter((l) => !letters.includes(l));
          } else {
            letters.forEach((l) => {
              if (!activeFilters.includes(l)) activeFilters.push(l);
            });
          }
          currentPage = 1;
          renderLibrary();
        };

        // A bis W
        for (let i = 65; i <= 87; i++) {
          const char = String.fromCharCode(i);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = char;
          btn.classList.toggle("active", activeFilters.includes(char));
          btn.addEventListener("click", () => toggleLetters([char]));
          filterBar.appendChild(btn);
        }

        // X-Y-Z
        const xyz = ["X", "Y", "Z"];
        const xyzBtn = document.createElement("button");
        xyzBtn.type = "button";
        xyzBtn.textContent = "X-Y-Z";
        xyzBtn.classList.toggle(
          "active",
          xyz.some((c) => activeFilters.includes(c))
        );
        xyzBtn.addEventListener("click", () => toggleLetters(xyz));
        filterBar.appendChild(xyzBtn);
      }

      // Standardsortierung: Autor → Serie → Band → Titel
      function defaultCompare(a, b) {
        const authorA = normalizeName(a.authors?.[0] || "").toLowerCase();
        const authorB = normalizeName(b.authors?.[0] || "").toLowerCase();
        if (authorA !== authorB) return authorA.localeCompare(authorB, "de");

        const hasSeriesA = !!a.series?.trim();
        const hasSeriesB = !!b.series?.trim();
        if (hasSeriesA !== hasSeriesB) return hasSeriesA ? 1 : -1;

        const seriesA = (a.series || "").toLowerCase();
        const seriesB = (b.series || "").toLowerCase();
        if (seriesA !== seriesB) return seriesA.localeCompare(seriesB, "de");

        const hasVolumeA = !!a.volume;
        const hasVolumeB = !!b.volume;
        if (hasVolumeA !== hasVolumeB) return hasVolumeA ? 1 : -1;

        const volumeA = parseFloat(a.volume) || 0;
        const volumeB = parseFloat(b.volume) || 0;
        if (volumeA !== volumeB) return volumeA - volumeB;

        return (a.title || "")
          .toLowerCase()
          .localeCompare((b.title || "").toLowerCase(), "de");
      }

      // Datum "2019", "2019-05" oder "2019-05-17" -> Zahl zum Sortieren
      function dateValue(str) {
        const m = String(str || "").match(/(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/);
        if (!m) return null;
        return (+m[1]) * 10000 + (+(m[2] || 0)) * 100 + (+(m[3] || 0));
      }

      function sortValue(book) {
        switch (sortField) {
          case "title":
            return (book.title || "").trim() || null;
          case "published":
            return dateValue(book.publishedDate);
          case "rating":
            return parseInt(book.rating, 10) || null;
          case "added":
            return book.addedAt || null;
          default:
            return null;
        }
      }

      function compareBooks(a, b) {
        const dir = sortDir === "asc" ? 1 : -1;
        if (sortField === "author") return defaultCompare(a, b) * dir;

        const va = sortValue(a);
        const vb = sortValue(b);
        // Bücher ohne Wert (kein Datum, keine Bewertung …) immer ans Ende
        if ((va === null) !== (vb === null)) return va === null ? 1 : -1;
        if (va !== null) {
          const c =
            typeof va === "string"
              ? va.localeCompare(vb, "de", { sensitivity: "base" })
              : va - vb;
          if (c !== 0) return c * dir;
        }
        return defaultCompare(a, b);
      }

      function getVisibleBooks() {
        let books = [...library];

        if (selectedCategories.length > 0) {
          books = books.filter((book) =>
            selectedCategories.includes(book.category)
          );
        }

        if (selectedGenres.length > 0) {
          const selected = selectedGenres.map((g) => g.toLowerCase());
          books = books.filter((book) => {
            const bookGenres = (book.genre || "")
              .split(";")
              .map((g) => g.trim().toLowerCase());
            return genreMatchMode === "all"
              ? selected.every((sel) => bookGenres.includes(sel))
              : selected.some((sel) => bookGenres.includes(sel));
          });
        }

        const searchTerm = $("search-input").value.trim().toLowerCase();
        if (searchTerm) {
          const isbnTerm = searchTerm.replace(/[-\s]/g, "");
          const searchIsbn = /\d/.test(isbnTerm);
          books = books.filter(
            (book) =>
              (book.title || "").toLowerCase().includes(searchTerm) ||
              (book.subtitle || "").toLowerCase().includes(searchTerm) ||
              (book.authors || []).join("; ").toLowerCase().includes(searchTerm) ||
              (book.series || "").toLowerCase().includes(searchTerm) ||
              (searchIsbn &&
                (book.isbn || "")
                  .toLowerCase()
                  .replace(/[-\s]/g, "")
                  .includes(isbnTerm)) ||
              (book.tags || []).some((tag) =>
                tag.toLowerCase().includes(searchTerm)
              )
          );
        }

        if (filterStatus === "read") {
          books = books.filter((book) => book.read === true);
        } else if (filterStatus === "unread") {
          books = books.filter((book) => book.read !== true);
        }

        if (activeFilters.length > 0) {
          books = books.filter((book) =>
            (book.authors || []).some((author) =>
              activeFilters.includes(normalizeFirstLetter(author))
            )
          );
        }

        if (showLatestAdded) {
          // Die 40 zuletzt hinzugefügten, neueste zuerst
          return books
            .filter((book) => book.addedAt)
            .sort((a, b) => b.addedAt - a.addedAt)
            .slice(0, 40);
        }

        return books.sort(compareBooks);
      }

      function starsHtml(rating) {
        const r = Math.max(0, Math.min(5, parseInt(rating, 10) || 0));
        return "★".repeat(r) + "☆".repeat(5 - r);
      }

      function renderLibrary() {
        renderFilterBar();
        updateSortControls();

        const libraryDiv = $("library");
        libraryDiv.innerHTML = "";

        const books = getVisibleBooks();

        // Seite begrenzen (z. B. nach Filtern oder Löschen)
        const totalPages = Math.max(1, Math.ceil(books.length / booksPerPage));
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * booksPerPage;
        const paginatedBooks = books.slice(start, start + booksPerPage);

        if (paginatedBooks.length === 0) {
          libraryDiv.innerHTML =
            '<p style="grid-column: 1 / -1; text-align: center;">Keine Bücher gefunden.</p>';
        }

        paginatedBooks.forEach((book) => {
          const index = library.indexOf(book);
          const div = document.createElement("div");
          div.className = "book";
          div.dataset.index = index;

          const authorsText = (book.authors || []).map(normalizeName).join("; ");
          const rating = parseInt(book.rating, 10) || 0;

          div.innerHTML = `
            <img src="${escapeHtml(book.thumbnail || NO_COVER)}" alt="Cover" data-action="detail">
            <div class="book-info">
              <div class="highlight-block">
                <div class="book-title">${escapeHtml(book.title)}</div>
                ${book.subtitle ? `<div class="book-subtitle">${escapeHtml(book.subtitle)}</div>` : ""}
                <div class="author">${escapeHtml(authorsText)}</div>
              </div>
              ${book.series ? `<div><b>Serie:</b> ${escapeHtml(book.series)}</div>` : ""}
              ${book.volume ? `<div><b>Band:</b> ${escapeHtml(book.volume)}</div>` : ""}
              ${book.category ? `<div><b>Kategorie:</b> ${escapeHtml(book.category)}</div>` : ""}
              ${book.genre ? `<div><b>Genre:</b> ${escapeHtml(book.genre)}</div>` : ""}
              <div><b>Status:</b> <span style="color: ${book.read ? "#3feb57" : "#00bfff"};">
                ${book.read ? "📗 Gelesen" : "🆕 Ungelesen"}</span>
              </div>
              ${
                rating
                  ? `<div class="stars-display" title="${rating} von 5 Sternen">${starsHtml(rating)}</div>`
                  : ""
              }
              <div class="book-actions">
                <button type="button" data-action="edit" title="Bearbeiten">✏️</button>
                <button type="button" data-action="delete" title="Löschen">🗑️</button>
              </div>
            </div>
          `;

          const img = div.querySelector("img");
          img.addEventListener("error", () => {
            if (img.src !== NO_COVER) img.src = NO_COVER;
          });

          libraryDiv.appendChild(div);
        });

        updateReadCounter();
        renderPagination(books.length);
      }

      function renderPagination(totalBooks) {
        const totalPages = Math.ceil(totalBooks / booksPerPage);
        const container = $("pagination-buttons");
        container.innerHTML = "";

        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = i;
          if (i === currentPage) btn.classList.add("active");
          btn.addEventListener("click", () => {
            currentPage = i;
            renderLibrary();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          container.appendChild(btn);
        }
      }

      function updateReadCounter() {
        const count = library.filter((book) => book.read === true).length;
        $("read-counter").textContent = `📗 Gelesen: ${count} von ${library.length} Büchern`;
      }

      function updateSortControls() {
        const select = $("sort-field");
        const dirBtn = $("sort-dir");
        select.value = sortField;
        dirBtn.textContent = sortDir === "asc" ? "↑ Aufsteigend" : "↓ Absteigend";
        select.disabled = showLatestAdded;
        dirBtn.disabled = showLatestAdded;
        const hint = showLatestAdded
          ? "Bei „Zuletzt hinzugefügt“ wird nach Datum sortiert"
          : "";
        select.title = hint;
        dirBtn.title = hint || "Sortierrichtung umkehren";
      }

      // =====================================================================
      // Modale Fenster
      // =====================================================================
      function openModal(id) {
        $(id).classList.remove("hidden");
      }

      function closeModal(id) {
        $(id).classList.add("hidden");
      }

      // --- Kategorie ---
      function openCategorySelector() {
        const list = $("category-list");
        list.innerHTML = "";
        const currentCategory = selectedCategories[0];

        Object.keys(genreMap).forEach((cat) => {
          const li = document.createElement("li");
          li.textContent = cat;
          if (cat === currentCategory) li.classList.add("active");
          li.addEventListener("click", () => {
            filterByCategory(cat);
            closeModal("category-modal");
          });
          list.appendChild(li);
        });

        openModal("category-modal");
      }

      function filterByCategory(category) {
        const categoryBtn = $("category-button");
        const genreBtn = $("genre-button");

        if (selectedCategories[0] === category) {
          selectedCategories = [];
          categoryBtn.textContent = "Kategorie filtern";
          categoryBtn.classList.remove("active");
        } else {
          selectedCategories = [category];
          categoryBtn.textContent = category;
          categoryBtn.classList.add("active");
        }

        // Genre-Filter zurücksetzen
        selectedGenres = [];
        genreBtn.textContent = "Genre filtern";
        genreBtn.classList.remove("active");

        currentPage = 1;
        renderLibrary();
      }

      // --- Genre ---
      function openGenreSelector() {
        const form = $("genre-form");
        form.innerHTML = "";

        const selectedCategory = selectedCategories[0];
        const genres = genreMap[selectedCategory] || ALL_GENRES;
        $("genre-modal-title").textContent = selectedCategory
          ? `Genres auswählen (${selectedCategory})`
          : "Genres auswählen (alle Kategorien)";

        genres.forEach((gen) => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = gen;
          checkbox.name = "genre";
          checkbox.checked = selectedGenres.includes(gen);
          label.appendChild(checkbox);
          label.append(" ", gen);
          form.appendChild(label);
        });

        $("genreMatchToggle").checked = genreMatchMode === "all";
        openModal("genre-modal");
      }

      function applyGenreSelection() {
        selectedGenres = [
          ...$("genre-form").querySelectorAll('input[name="genre"]:checked'),
        ].map((input) => input.value);

        const genreBtn = $("genre-button");
        if (selectedGenres.length > 0) {
          genreBtn.textContent = selectedGenres.join(", ");
          genreBtn.classList.add("active");
        } else {
          genreBtn.textContent = "Genre filtern";
          genreBtn.classList.remove("active");
        }

        closeModal("genre-modal");
        currentPage = 1;
        renderLibrary();
      }

      // --- Detailansicht ---
      function showDetailModal(index) {
        const book = library[index];
        if (!book) return;
        const content = $("detail-modal-content");
        const rating = parseInt(book.rating, 10) || 0;

        content.innerHTML = `
          <div style="text-align: center;">
            <h3 style="margin-bottom: 0.3rem;">${escapeHtml(book.title)}</h3>
            ${
              book.subtitle
                ? `<div style="font-size: 0.95rem; margin-bottom: 1rem;">${escapeHtml(book.subtitle)}</div>`
                : ""
            }
          </div>

          <div style="display: flex; gap: 1rem; justify-content: center; align-items: flex-start; flex-wrap: wrap;">
            <div style="flex: 1 1 250px; min-width: 220px;">
              <p><b>Autor:</b> ${escapeHtml((book.authors || []).join("; "))}</p>
              ${book.series ? `<p><b>Serie:</b> ${escapeHtml(book.series)}</p>` : ""}
              ${book.volume ? `<p><b>Band:</b> ${escapeHtml(book.volume)}</p>` : ""}
              ${book.category ? `<p><b>Kategorie:</b> ${escapeHtml(book.category)}</p>` : ""}
              ${book.genre ? `<p><b>Genre:</b> ${escapeHtml(book.genre)}</p>` : ""}
              ${book.pageCount ? `<p><b>Seiten:</b> ${escapeHtml(book.pageCount)}</p>` : ""}
              ${book.publishedDate ? `<p><b>Veröffentlicht:</b> ${escapeHtml(book.publishedDate)}</p>` : ""}
              ${book.isbn ? `<p><b>ISBN:</b> ${escapeHtml(book.isbn)}</p>` : ""}
              <p><b>Status:</b> <span style="color: ${book.read ? "#3feb57" : "#00bfff"};">
                ${book.read ? "📗 Gelesen" : "🆕 Ungelesen"}</span></p>
              ${
                rating
                  ? `<p><b>Bewertung:</b> <span class="stars-display" title="${rating} von 5 Sternen">${starsHtml(rating)}</span></p>`
                  : ""
              }
              ${
                book.tags?.length
                  ? `<p><b>Tags:</b> ${book.tags
                      .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
                      .join(" ")}</p>`
                  : ""
              }
            </div>
            ${
              book.thumbnail
                ? `<img src="${escapeHtml(book.thumbnail)}" alt="Cover" style="height: 220px; border-radius: 5px;">`
                : ""
            }
          </div>

          ${
            book.description
              ? `<div style="margin-top: 0.3rem;">${sanitizeHtml(book.description)}</div>`
              : ""
          }

          <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
            <button type="button" id="detail-edit">Bearbeiten</button>
            <button type="button" id="detail-close">Schließen</button>
          </div>
        `;

        $("detail-edit").addEventListener("click", () => {
          closeModal("detail-modal");
          editBook(index);
        });
        $("detail-close").addEventListener("click", () =>
          closeModal("detail-modal")
        );

        openModal("detail-modal");
      }

      // =====================================================================
      // Formular (Neu / Bearbeiten)
      // =====================================================================
      function updateStarDisplay(container, value) {
        container.querySelectorAll("span").forEach((star) => {
          const active = parseInt(star.dataset.star, 10) <= value;
          star.classList.toggle("active", active);
          star.textContent = active ? "★" : "☆";
        });
      }

      function setRating(value) {
        const ratingDiv = $("edit-rating");
        ratingDiv.dataset.value = value;
        updateStarDisplay(ratingDiv, value);
      }

      function setupStarRating() {
        const ratingDiv = $("edit-rating");
        ratingDiv.querySelectorAll("span").forEach((star) => {
          star.addEventListener("click", () => {
            const value = parseInt(star.dataset.star, 10);
            const current = parseInt(ratingDiv.dataset.value, 10) || 0;
            // Erneuter Klick auf denselben Stern entfernt die Bewertung
            setRating(value === current ? 0 : value);
          });
        });
      }

      function updateGenreSuggestions(category) {
        const genreList = $("genreSuggestions");
        genreList.innerHTML = "";
        (genreMap[category] || ALL_GENRES).forEach((genre) => {
          const option = document.createElement("option");
          option.value = genre;
          genreList.appendChild(option);
        });
      }

      function populateCategorySuggestions() {
        const categoryList = $("categorySuggestions");
        categoryList.innerHTML = "";
        Object.keys(genreMap).forEach((cat) => {
          const option = document.createElement("option");
          option.value = cat;
          categoryList.appendChild(option);
        });
      }

      function newBookEntry() {
        $("edit-form").reset();
        $("edit-index").value = "";
        setRating(0);
        updateGenreSuggestions("");
        $("edit-dialog").showModal();
      }

      function editBook(index) {
        const book = library[index];
        if (!book) return;
        $("edit-index").value = index;
        $("edit-title").value = book.title || "";
        $("edit-subtitle").value = book.subtitle || "";
        $("edit-authors").value = (book.authors || []).join("; ");
        $("edit-series").value = book.series || "";
        $("edit-volume").value = book.volume || "";
        $("edit-publishedDate").value = book.publishedDate || "";
        $("edit-isbn").value = book.isbn || "";
        $("edit-category").value = book.category || "";
        $("edit-genre").value = book.genre || "";
        $("edit-description").value = book.description || "";
        $("edit-pageCount").value = book.pageCount || "";
        $("edit-thumbnail").value = book.thumbnail || "";
        $("edit-read").checked = !!book.read;
        $("edit-tags").value = (book.tags || []).join(", ");

        updateGenreSuggestions(book.category);
        setRating(parseInt(book.rating, 10) || 0);
        $("edit-dialog").showModal();
      }

      function saveBookFromForm() {
        const index = $("edit-index").value;
        const data = {
          title: $("edit-title").value.trim(),
          subtitle: $("edit-subtitle").value.trim(),
          authors: $("edit-authors")
            .value.split(";")
            .map((a) => normalizeName(a))
            .filter(Boolean),
          series: $("edit-series").value.trim(),
          volume: formatVolume($("edit-volume").value),
          publishedDate: $("edit-publishedDate").value.trim(),
          isbn: $("edit-isbn").value.trim(),
          category: $("edit-category").value.trim(),
          genre: normalizeName($("edit-genre").value),
          description: $("edit-description").value.trim(),
          pageCount: $("edit-pageCount").value.trim(),
          thumbnail: $("edit-thumbnail").value.trim(),
          read: $("edit-read").checked,
          rating: parseInt($("edit-rating").dataset.value, 10) || null,
          tags: $("edit-tags")
            .value.split(",")
            .map((tag) => tag.trim())
            .filter(Boolean),
        };

        if (index !== "" && library[+index]) {
          library[+index] = { ...library[+index], ...data };
        } else {
          library.push({ ...data, addedAt: Date.now() });
        }

        persistLibrary();
        renderLibrary();
      }

      // =====================================================================
      // EPUB-Import
      // =====================================================================
      function extractIsbn(opfDoc) {
        const isIsbnScheme = (el) =>
          /isbn/i.test(el.getAttribute("opf:scheme") || el.getAttribute("scheme") || "");
        const ids = [...opfDoc.querySelectorAll("metadata > identifier")].sort(
          (a, b) => isIsbnScheme(b) - isIsbnScheme(a)
        );
        for (const el of ids) {
          const raw = el.textContent.trim().replace(/^(urn:)?isbn:/i, "");
          // Nur Ziffern, Bindestriche, Leerzeichen und X – schließt UUIDs u. Ä. aus
          if (!/^[\dXx\s-]+$/.test(raw)) continue;
          const c = cleanIsbn(raw);
          if (isValidIsbn(c)) return toIsbn13(c);
        }
        return "";
      }

      function readSeries(opfDoc, book) {
        const metas = [...opfDoc.querySelectorAll("metadata > meta")];

        // EPUB2 / Calibre
        metas.forEach((meta) => {
          const name = meta.getAttribute("name");
          const content = meta.getAttribute("content") || "";
          if (name === "calibre:series") book.series = content.trim();
          else if (name === "calibre:series_index") book.volume = formatVolume(content);
        });

        // EPUB3
        if (!book.series) {
          const coll = metas.find(
            (m) => m.getAttribute("property") === "belongs-to-collection"
          );
          if (coll) {
            book.series = coll.textContent.trim();
            const id = coll.getAttribute("id");
            if (id) {
              const pos = metas.find(
                (m) =>
                  m.getAttribute("refines") === `#${id}` &&
                  m.getAttribute("property") === "group-position"
              );
              if (pos) book.volume = formatVolume(pos.textContent);
            }
          }
        }
      }

      // Liefert true, wenn das Buch hinzugefügt wurde
      async function processFile(file) {
        const zip = await JSZip.loadAsync(file);
        const containerEntry = zip.file("META-INF/container.xml");
        if (!containerEntry) throw new Error("META-INF/container.xml fehlt");

        const parser = new DOMParser();
        const containerDoc = parser.parseFromString(
          await containerEntry.async("string"),
          "application/xml"
        );
        const rootfilePath = containerDoc
          .querySelector("rootfile")
          ?.getAttribute("full-path");
        const opfEntry = rootfilePath ? zip.file(rootfilePath) : null;
        if (!opfEntry) throw new Error("OPF-Datei nicht gefunden");

        const opfDoc = parser.parseFromString(
          await opfEntry.async("string"),
          "application/xml"
        );

        const isbn = extractIsbn(opfDoc);
        if (isbn && isbnExists(isbn)) {
          showToast(`Buch mit ISBN ${isbn} ist bereits vorhanden!`);
          return false;
        }

        const book = {
          title:
            opfDoc.querySelector("metadata > title")?.textContent.trim() ||
            file.name.replace(/\.epub$/i, ""),
          subtitle: "",
          authors: formatAuthors(
            [...opfDoc.querySelectorAll("metadata > creator")].map((el) =>
              el.textContent.trim()
            )
          ),
          isbn,
          series: "",
          volume: "",
          publishedDate: "",
          description: "",
          thumbnail: "",
          read: false,
          pageCount: "",
          tags: [],
          addedAt: Date.now(),
        };

        readSeries(opfDoc, book);

        if (isbn) {
          try {
            const info = await fetchGoogleInfo(isbn);
            if (info) applyGoogleInfo(book, info);
            else console.warn(`Keine Google-Books-Info für ISBN ${isbn}.`);
          } catch (e) {
            console.error("Fehler bei der Google API:", e);
          }
        } else {
          console.warn(`Keine gültige ISBN in der Datei ${file.name} gefunden.`);
        }

        library.push(book);
        return true;
      }

      async function handleEpubImport(e) {
        const files = Array.from(e.target.files);
        e.target.value = ""; // dieselbe Datei kann erneut gewählt werden
        if (!files.length) return;

        let imported = 0;
        const failed = [];
        for (const file of files) {
          try {
            if (await processFile(file)) imported++;
          } catch (err) {
            console.error(`Import fehlgeschlagen: ${file.name}`, err);
            failed.push(file.name);
          }
        }

        persistLibrary();
        renderLibrary();

        let msg = `${imported} ${imported === 1 ? "Buch" : "Bücher"} importiert.`;
        if (failed.length) msg += ` Fehlgeschlagen: ${failed.join(", ")}`;
        showToast(msg, failed.length ? 6000 : 3000);
      }

      // =====================================================================
      // Per ISBN hinzufügen
      // =====================================================================
      async function addBookByISBN() {
        const userInput = prompt("Bitte die ISBN eingeben:");
        if (!userInput) return;

        const raw = cleanIsbn(userInput);
        if (!isValidIsbn(raw)) {
          showToast("Ungültige ISBN – bitte Eingabe prüfen.");
          return;
        }
        const isbn = toIsbn13(raw);

        if (isbnExists(isbn)) {
          showToast("Ein Buch mit dieser ISBN ist bereits in der Bibliothek.");
          return;
        }

        try {
          const info = await fetchGoogleInfo(isbn);
          if (!info) {
            showToast("Kein Buch mit dieser ISBN gefunden.");
            return;
          }

          const book = {
            title: "Unbekannter Titel",
            subtitle: "",
            authors: ["Unbekannter Autor"],
            series: "",
            volume: "",
            publishedDate: "",
            isbn,
            category: "",
            genre: "",
            description: "",
            pageCount: "",
            thumbnail: "",
            read: false,
            tags: [],
            addedAt: Date.now(),
          };
          applyGoogleInfo(book, info);

          library.push(book);
          persistLibrary();
          renderLibrary();
          showToast(`„${book.title}“ wurde hinzugefügt.`);
        } catch (error) {
          console.error("Fehler bei der ISBN-Suche:", error);
          showToast("Es gab ein Problem beim Abrufen der Buchdaten.");
        }
      }

      // =====================================================================
      // Speichern / Laden (JSON)
      // =====================================================================
      function saveLibrary() {
        const blob = new Blob([JSON.stringify(library, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "bibliothek_.json";
        a.click();
        URL.revokeObjectURL(url);
      }

      async function handleLoadLibrary(e) {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        try {
          const json = JSON.parse(await file.text());
          if (!Array.isArray(json)) {
            showToast("Ungültiges Format");
            return;
          }
          library = json
            .filter((b) => b && typeof b === "object")
            .map(normalizeBook);
          persistLibrary();
          currentPage = 1;
          renderLibrary();
          showToast(`${library.length} Bücher geladen.`);
        } catch (err) {
          console.error(err);
          showToast("Fehler beim Laden der Datei");
        }
      }

      // =====================================================================
      // Löschen
      // =====================================================================
      function confirmRemoveBook(index) {
        const book = library[index];
        if (!book) return;
        if (confirm(`Möchtest du „${book.title || "dieses Buch"}“ wirklich löschen?`)) {
          removeBook(index);
        }
      }

      function removeBook(index) {
        const doRemove = () => {
          library.splice(index, 1);
          persistLibrary();
          renderLibrary();
        };
        const card = document.querySelector(
          `#library .book[data-index="${index}"]`
        );
        if (card) {
          card.classList.add("fade-out");
          setTimeout(doRemove, 300);
        } else {
          doRemove();
        }
      }

      // =====================================================================
      // Status-Filter, Suche, Darstellung
      // =====================================================================
      function setFilterStatus(status) {
        filterStatus = filterStatus === status ? "all" : status;
        currentPage = 1;
        renderLibrary();

        $("read-btn").classList.toggle("active", filterStatus === "read");
        $("unread-btn").classList.toggle("active", filterStatus === "unread");

        // Touch-Fokus/Hover verhindern
        if (document.activeElement instanceof HTMLElement) {
          document.activeElement.blur();
        }
      }

      function updateClearButton() {
        $("clear-search").style.display =
          $("search-input").value.trim() !== "" ? "inline" : "none";
      }

      function clearSearch() {
        $("search-input").value = "";
        updateClearButton();
        currentPage = 1;
        renderLibrary();
      }

      function toggleMode() {
        const isLight = document.body.classList.toggle("light-mode");
        localStorage.setItem("library-mode", isLight ? "light" : "dark");
        $("mode-toggle").textContent = isLight ? "🌞" : "🌙";
      }

      function toggleViewMode() {
        compactViewEnabled = !compactViewEnabled;
        document.body.classList.toggle("compact-view", compactViewEnabled);
        $("viewToggleBtn").textContent = compactViewEnabled ? "🔼" : "🔽";
        localStorage.setItem("library-view", compactViewEnabled ? "compact" : "detail");
      }

      // =====================================================================
      // Bibliothek aus dem GitHub-Repository laden
      // =====================================================================
      async function loadLibraryFromRepo() {
        try {
          // no-store: nach dem Austausch der JSON nicht die alte Browser-Kopie nehmen
          const response = await fetch(REPO_JSON_URL, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const json = await response.json();
          if (!Array.isArray(json)) throw new Error("Ungültiges Format");
          library = json
            .filter((b) => b && typeof b === "object")
            .map(normalizeBook);
          persistLibrary(); // Offline-Kopie für den nächsten Aufruf
          renderLibrary();
        } catch (err) {
          console.error("Fehler beim Laden der Bibliothek von GitHub:", err);
          showToast(
            library.length
              ? "GitHub nicht erreichbar – die zuletzt gespeicherte Bibliothek wird angezeigt."
              : "Die Bibliothek konnte nicht von GitHub geladen werden.",
            6000
          );
        }
      }

      // =====================================================================
      // Initialisierung (Skript steht am Ende des body – DOM ist bereit)
      // =====================================================================
      function init() {
        // Gespeicherte Darstellung wiederherstellen
        if (localStorage.getItem("library-mode") === "light") {
          document.body.classList.add("light-mode");
          $("mode-toggle").textContent = "🌞";
        }
        if (localStorage.getItem("library-view") === "compact") {
          toggleViewMode();
        }
        $("booksPerPage").value = String(booksPerPage);
        if ($("booksPerPage").value !== String(booksPerPage)) {
          booksPerPage = 50;
          $("booksPerPage").value = "50";
        }

        populateCategorySuggestions();
        setupStarRating();

        // Oberste Buttons
        $("viewToggleBtn").addEventListener("click", toggleViewMode);
        $("mode-toggle").addEventListener("click", toggleMode);

        // Hauptbuttons
        $("btn-add-isbn").addEventListener("click", addBookByISBN);
        $("btn-import").addEventListener("click", () => $("file-input").click());
        $("btn-new").addEventListener("click", newBookEntry);
        $("btn-save").addEventListener("click", saveLibrary);
        $("btn-load").addEventListener("click", () => $("load-file").click());
        $("file-input").addEventListener("change", handleEpubImport);
        $("load-file").addEventListener("change", handleLoadLibrary);

        // Filter
        $("read-btn").addEventListener("click", () => setFilterStatus("read"));
        $("unread-btn").addEventListener("click", () => setFilterStatus("unread"));
        $("latest-added-button").addEventListener("click", (e) => {
          showLatestAdded = !showLatestAdded;
          e.currentTarget.classList.toggle("active", showLatestAdded);
          currentPage = 1;
          renderLibrary();
        });
        $("category-button").addEventListener("click", openCategorySelector);
        $("genre-button").addEventListener("click", openGenreSelector);
        $("category-cancel").addEventListener("click", () => closeModal("category-modal"));
        $("genre-apply").addEventListener("click", applyGenreSelection);
        $("genre-cancel").addEventListener("click", () => closeModal("genre-modal"));
        $("genreMatchToggle").addEventListener("change", function () {
          genreMatchMode = this.checked ? "all" : "any";
          if (selectedGenres.length) {
            currentPage = 1;
            renderLibrary();
          }
        });

        // Sortierung
        $("sort-field").addEventListener("change", (e) => {
          sortField = e.target.value;
          sortDir = DEFAULT_SORT_DIR[sortField] || "asc";
          localStorage.setItem("library-sort-field", sortField);
          localStorage.setItem("library-sort-dir", sortDir);
          currentPage = 1;
          renderLibrary();
        });
        $("sort-dir").addEventListener("click", () => {
          sortDir = sortDir === "asc" ? "desc" : "asc";
          localStorage.setItem("library-sort-dir", sortDir);
          currentPage = 1;
          renderLibrary();
        });

        // Suche
        const searchInput = $("search-input");
        searchInput.addEventListener("input", () => {
          updateClearButton();
          currentPage = 1;
          renderLibrary();
        });
        searchInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            clearSearch();
          }
        });
        $("clear-search").addEventListener("click", clearSearch);

        // Bücher pro Seite
        $("booksPerPage").addEventListener("change", (event) => {
          const value = parseInt(event.target.value, 10);
          if (!isNaN(value)) {
            booksPerPage = value;
            currentPage = 1;
            localStorage.setItem("booksPerPage", value);
            renderLibrary();
          }
        });

        // Klicks auf Buchkarten (Cover, Bearbeiten, Löschen)
        $("library").addEventListener("click", (e) => {
          const el = e.target.closest("[data-action]");
          if (!el) return;
          const card = el.closest(".book");
          const index = Number(card?.dataset.index);
          if (!Number.isInteger(index) || !library[index]) return;
          if (el.dataset.action === "detail") showDetailModal(index);
          else if (el.dataset.action === "edit") editBook(index);
          else if (el.dataset.action === "delete") confirmRemoveBook(index);
        });

        // Formular
        $("edit-form").addEventListener("submit", saveBookFromForm);
        $("edit-cancel").addEventListener("click", () => $("edit-dialog").close());
        $("edit-category").addEventListener("input", (e) =>
          updateGenreSuggestions(e.target.value)
        );
        // Beim Wechsel der Kategorie nur unpassende Genres entfernen
        $("edit-category").addEventListener("change", (e) => {
          const genres = genreMap[e.target.value];
          if (!genres) return;
          const genreInput = $("edit-genre");
          const parts = genreInput.value.split(";").map((s) => s.trim()).filter(Boolean);
          const kept = parts.filter((p) => genres.includes(p));
          if (kept.length !== parts.length) genreInput.value = kept.join("; ");
        });

        // Komfort: Modale per Klick auf den Hintergrund schließen
        // (das Bearbeitungsformular bewusst nicht – Schutz vor Datenverlust)
        document.querySelectorAll(".modal").forEach((modal) => {
          modal.addEventListener("click", (e) => {
            if (e.target === modal) modal.classList.add("hidden");
          });
        });

        // Komfort: Escape schließt das oberste geöffnete Fenster
        // (das Bearbeitungsformular schließt der Browser selbst)
        document.addEventListener("keydown", (e) => {
          if (e.key !== "Escape" || $("edit-dialog").open) return;
          const open = [...document.querySelectorAll(".modal:not(.hidden)")];
          if (open.length) {
            open[open.length - 1].classList.add("hidden");
            e.preventDefault();
          }
        });

        updateClearButton();
        renderLibrary(); // sofort die gespeicherte Kopie zeigen …
        loadLibraryFromRepo(); // … und dann die aktuelle Version von GitHub
      }

      init();
    </script>
  </body>
</html>
